@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#111314; --sheet:#1a1d1f; --ink:#e9eceb; --mute:#98a1a6; --hair:#2f3539; --soft:#212527;
  --brand:#d48f55; --brand-ink:#1a1206; --brand-bg:#2e2217;
  --ok:#5cc48f; --warn:#e3ad45; --bad:#f0796d; --idle:#98a1a6;
  --ok-bg:#16301f; --warn-bg:#36290d; --bad-bg:#3a1a17; --idle-bg:#272c2f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -12px rgba(0,0,0,.7); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --desk:#111314; --sheet:#1a1d1f; --ink:#e9eceb; --mute:#98a1a6; --hair:#2f3539; --soft:#212527;
  --brand:#d48f55; --brand-ink:#1a1206; --brand-bg:#2e2217;
  --ok:#5cc48f; --warn:#e3ad45; --bad:#f0796d; --idle:#98a1a6;
  --ok-bg:#16301f; --warn-bg:#36290d; --bad-bg:#3a1a17; --idle-bg:#272c2f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -12px rgba(0,0,0,.7); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--desk);color:var(--ink);font:400 15px/1.5 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 20px;background:var(--sheet);border-bottom:1.5px solid var(--ink);position:sticky;top:0;z-index:10}
.logo{width:42px;height:42px;flex:none;background:#fff var(--logo) center/contain no-repeat;border:1px solid var(--hair)}
.who{display:flex;flex-direction:column;line-height:1.2;margin-right:6px}
.who b{font:700 15px var(--f-display);letter-spacing:.06em}
.who span{font-size:12.5px;color:var(--mute)}
.tabs{position:relative;display:flex;gap:2px;flex-wrap:wrap}
.tabs a{padding:8px 11px;text-decoration:none;color:var(--mute);font:600 14px var(--f-display);white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a.on{color:var(--ink)}
.ink{position:absolute;left:0;top:0;height:2px;width:0;background:var(--brand);pointer-events:none}
.sv{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);--pc:var(--warn)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);background:var(--sheet);padding:6px 12px;border-radius:3px;font:600 13.5px var(--f-display);white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.q{border-color:var(--hair);font-weight:500}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8}
.ib{width:30px;height:30px;display:inline-grid;place-items:center;border:1px solid var(--hair);background:none;border-radius:3px;font:500 16px var(--f-mono);color:inherit;flex:none}
.ib:hover{border-color:var(--ink)}

/* ---------- inputs & dropdowns ---------- */
.in{width:100%;border:1px solid transparent;background:transparent;padding:4px 6px;border-radius:3px;min-width:0}
.in:hover{border-color:var(--hair)}
.in:focus{border-color:var(--brand);background:var(--sheet);outline:0}
textarea.in{resize:none;overflow:hidden;display:block;line-height:1.45}
.sel{appearance:none;-webkit-appearance:none;width:100%;min-width:0;border:1px solid transparent;border-radius:3px;padding:4px 22px 4px 6px;background:transparent var(--chev) no-repeat right 7px center;text-overflow:ellipsis;cursor:pointer}
.sel:hover{border-color:var(--hair);background-color:var(--soft)}
.sel:focus{border-color:var(--brand);outline:0}
.sel option,.mini option,.pill option{background:var(--sheet);color:var(--ink)}
.box{border:1px solid var(--hair);border-radius:3px;padding:7px 9px;background:var(--sheet);color:var(--ink);font-size:15px;width:100%;min-width:0}
.box:focus{border-color:var(--brand);outline:0}
textarea.box{min-height:76px;resize:vertical;line-height:1.5}
select.box,.f.sel{appearance:none;-webkit-appearance:none;background:var(--sheet) var(--chev) no-repeat right 10px center;padding-right:28px;border:1px solid var(--hair);cursor:pointer}
select.pill{appearance:none;-webkit-appearance:none;width:100%;border:1px solid transparent;border-radius:3px;padding:4px 22px 4px 8px;font-weight:600;font-size:13.5px;background:var(--idle-bg) var(--chev) no-repeat right 7px center;color:var(--idle);cursor:pointer}
select.pill.s-doing{background-color:var(--warn-bg);color:var(--warn)}
select.pill.s-delayed{background-color:var(--bad-bg);color:var(--bad)}
select.pill.s-done{background-color:var(--ok-bg);color:var(--ok)}
.mini{appearance:none;-webkit-appearance:none;border:1px solid var(--hair);border-radius:99px;padding:1px 20px 1px 9px;font-size:12.5px;line-height:1.6;background:var(--sheet) var(--chev) no-repeat right 7px center;color:var(--mute);max-width:100%;cursor:pointer}
.mini:hover{border-color:var(--ink)}
.mini.pr-high{border-color:var(--bad);color:var(--bad);background-color:var(--bad-bg);font-weight:600}
.mini.pr-mid{border-color:var(--warn);color:var(--warn)}
.mini.stg{border-color:var(--brand);color:var(--brand)}
.md{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--mute);border:1px solid var(--hair);border-radius:99px;padding:0 4px 0 9px}
.md input{border:0;background:none;font:400 12.5px var(--f-mono);padding:1px 2px;color:var(--ink);min-width:0}
.md.soon{border-color:var(--warn);color:var(--warn)}
.md.past{border-color:var(--bad);color:var(--bad)}
.urg{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--bad);background:var(--bad-bg);padding:1px 9px;border-radius:99px;white-space:nowrap}
.urg i,.cd-now i,.ph .live{width:7px;height:7px;border-radius:50%;background:var(--bad);flex:none;--pc:var(--bad)}
.seg{display:inline-flex;gap:2px;vertical-align:middle}
.seg i{width:8px;height:6px;border:1px solid var(--hair)}
.seg i.on{background:var(--brand);border-color:var(--brand)}

main{max-width:1260px;margin:0 auto;padding:20px 16px 72px}
.sheet{background:var(--sheet);border:1px solid var(--hair);padding:22px}
.note{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:9px 14px;margin-bottom:12px;background:var(--warn-bg);border-left:3px solid var(--warn);font-size:13.5px}
.note span{flex:1;min-width:200px}
.lb{display:block;font-size:11.5px;color:var(--mute);letter-spacing:.04em;margin-bottom:2px}
.h{margin:0 0 4px;font:700 20px var(--f-display);text-wrap:balance}
.sub{color:var(--mute);margin:0 0 16px;font-size:14px;max-width:65ch}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{padding:14px 9px;color:var(--mute);font-size:14px}

/* ---------- overview ---------- */
.ov{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.panel{background:var(--sheet);border:1px solid var(--hair);padding:16px 18px;min-width:0}
.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}.c12{grid-column:span 12}
.ph{display:flex;align-items:center;gap:10px;padding-bottom:8px;margin-bottom:12px;border-bottom:1.5px solid var(--ink)}
.ph h2{margin:0;font:700 16px var(--f-display)}
.ph .mono{color:var(--mute);font-size:13px}
.ph .lnk{margin-left:auto;font-size:13px;color:var(--brand);text-decoration:none;font-weight:500;background:none;border:0;padding:0}
.ph .lnk:hover{text-decoration:underline}
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:26px;border-top:4px solid var(--brand)}
.hero h1{margin:2px 0 14px;font:700 22px/1.3 var(--f-display);text-wrap:balance}
.cd{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.cd>div{border:1px solid var(--ink);padding:6px 8px 4px;min-width:66px;text-align:center}
.cd b{display:block;font:500 30px/1.1 var(--f-mono)}
.cd span{font-size:12px;color:var(--mute)}
.cd-now{display:flex;align-items:center;gap:10px;font:600 18px var(--f-display);color:var(--ok)}
.cd-now i{background:var(--ok);--pc:var(--ok);width:10px;height:10px}
.ag{list-style:none;margin:0;padding:0;border-left:1px solid var(--hair);align-self:start}
.ag li{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;padding:5px 0 5px 14px;font-size:14px;position:relative}
.ag li::before{content:"";position:absolute;left:-4px;top:12px;width:7px;height:7px;background:var(--sheet);border:1.5px solid var(--brand);border-radius:50%}
.ag time{font:400 13px var(--f-mono);color:var(--mute);padding-top:1px}
.ag small{color:var(--mute);font-size:12.5px;white-space:nowrap}
.ag small em{font-style:normal;color:var(--bad)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kpi{background:var(--sheet);border:1px solid var(--hair);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left;color:inherit}
button.kpi:hover{border-color:var(--ink)}
.kpi b{font:500 34px/1.1 var(--f-mono)}
.kpi small{color:var(--mute);font-size:12.5px}
.kpi.bad{border-top:3px solid var(--bad)}.kpi.bad b{color:var(--bad)}
.kpi.hot{border-top:3px solid var(--brand)}.kpi.hot b{color:var(--brand)}
.kr{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ring{width:50px;height:50px;flex:none}
.ul-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--hair);background:none;padding:9px 6px 9px 10px;border-left:3px solid var(--bad);color:inherit}
.ul-row:hover{background:var(--soft)}
.ul-row b{font-weight:500}
.ul-row small{color:var(--mute);font-size:12.5px;grid-column:1}
.ul-row .when{grid-row:1/3;grid-column:2;text-align:right;font:500 14px var(--f-mono);color:var(--bad);align-self:center}
.ul-row .when small{display:block;font:400 12px var(--f-body);color:var(--mute)}
.stat{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut{width:150px;height:150px;flex:none}
.d-big{font:500 24px var(--f-mono);fill:var(--ink)}
.d-sm{font:400 11px var(--f-body);fill:var(--mute)}
.leg{list-style:none;margin:0;padding:0;flex:1;min-width:170px}
.leg li{display:grid;grid-template-columns:10px 1fr auto 44px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--hair);font-size:14px}
.leg i{width:10px;height:10px}
.leg b{font:500 14px var(--f-mono)}
.leg .mono{color:var(--mute);font-size:12.5px;text-align:right}
.dp{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:3px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--hair);text-decoration:none;color:inherit}
.dp:hover h3{color:var(--brand)}
.dp .no{font:400 12.5px var(--f-mono);color:var(--brand)}
.dp h3{margin:0;font:600 14.5px var(--f-body)}
.dp .r{font:500 14px var(--f-mono)}
.gb{grid-column:2/-1;height:6px;background:var(--idle-bg);display:flex}
.gb i{display:block;height:100%;background:var(--ok)}
.dp small{grid-column:2/-1;color:var(--mute);font-size:12.5px}
.dp small em{font-style:normal;color:var(--bad)}
.pipe{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;align-items:end}
.pp{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.pp b{font-size:16px}
.pp-bar{width:100%;height:100px;background:var(--soft);display:flex;align-items:flex-end}
.pp-bar i{display:block;width:100%;background:var(--ink)}
.pp.pre .pp-bar i{background:var(--warn)}
.pp small{font-size:11.5px;color:var(--mute);line-height:1.25;min-height:30px}
.pnote{font-size:12.5px;color:var(--mute);margin-top:10px;display:flex;gap:14px;flex-wrap:wrap}
.pnote span{display:inline-flex;gap:6px;align-items:center}
.sw{width:10px;height:10px;display:inline-block}
.tl{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(118px,1fr);overflow-x:auto;border:1px solid var(--hair)}
.tl-col{border-left:1px solid var(--hair);padding:6px;min-height:150px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tl-col:first-child{border-left:0}
.tl-col.wkend{background:var(--soft)}
.tl-col.today{background:var(--brand-bg);box-shadow:inset 0 3px 0 var(--brand)}
.tl-col.late-col{background:var(--bad-bg)}
.tl-h{display:flex;justify-content:space-between;gap:4px;font-size:12px;color:var(--mute);padding-bottom:4px}
.tl-h b{font:500 13px var(--f-body);color:var(--ink)}
.tchip{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--idle);background:var(--sheet);padding:4px 6px;font-size:12.5px;line-height:1.3;box-shadow:inset 0 0 0 1px var(--hair);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:inherit}
.tchip.s-doing{border-left-color:var(--warn)}.tchip.s-delayed{border-left-color:var(--bad)}.tchip.s-done{border-left-color:var(--ok);opacity:.6;text-decoration:line-through}
.tchip.k-need{border-left-color:var(--brand);border-left-style:dashed}
.tchip em{display:block;font-style:normal;font-size:11px;color:var(--brand);font-weight:600;text-decoration:none}
.tchip:hover{box-shadow:inset 0 0 0 1px var(--ink)}
.wr{display:grid;grid-template-columns:minmax(80px,140px) minmax(0,1fr) 26px;gap:10px;align-items:center;padding:6px 0;font-size:14px;border-bottom:1px solid var(--hair)}
.wr span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wb{display:flex;height:14px;background:var(--soft)}
.wb i{display:block;height:100%}
.wb .l{background:var(--bad)}.wb .d{background:var(--warn)}.wb .r{background:var(--ink)}
.wr b{font:500 14px var(--f-mono);text-align:right}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:7px 0;border-bottom:1px solid var(--hair);font-size:14px}
.feed button{border:0;background:none;padding:0;text-align:left;color:inherit;min-width:0}
.feed button:hover b{color:var(--brand)}
.feed button b{font-weight:500}
.feed button span{color:var(--mute);display:block;font-size:13px}
.feed time{font-size:12px;color:var(--mute);white-space:nowrap}

/* ---------- report: title block ---------- */
.tb{display:grid;grid-template-columns:2.2fr 1.6fr 1fr 1.1fr;border:1.5px solid var(--ink)}
.tb>div{padding:10px 14px;border-left:1px solid var(--ink);min-width:0}
.tb>div:first-child{border-left:0}
.tb h1{margin:0;font:700 21px/1.25 var(--f-display);text-wrap:balance}
.wk{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wk b{font:500 20px var(--f-mono)}
.wk small{display:block;color:var(--mute);font-size:12.5px}
.sum{display:grid;grid-template-columns:1fr auto;gap:8px 28px;align-items:center;padding:16px 0 14px;border-bottom:1px solid var(--hair)}
.stack{display:flex;height:14px;background:var(--idle-bg);overflow:hidden;border-radius:2px}
.stack i{display:block;height:100%}
.b-done{background:var(--ok)}.b-doing{background:var(--warn)}.b-delayed{background:var(--bad)}.b-todo{background:var(--idle)}
.figs{display:flex;gap:22px;flex-wrap:wrap}
.figs div{font-size:12.5px;color:var(--mute);line-height:1.25}
.figs b{display:block;font:500 20px var(--f-mono);color:var(--ink)}
.figs .alert b{color:var(--bad)}
.chips{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--hair);background:none;border-radius:3px;padding:3px 10px;font-size:13px;display:inline-flex;gap:7px;align-items:center}
.chip b{font:500 13px var(--f-mono)}
.chip::before{content:"";width:8px;height:8px;background:var(--c,var(--ink))}
.chip:hover{border-color:var(--mute)}
.chip.on{border-color:var(--ink);background:var(--soft)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 0}
.tools .f{border:1px solid var(--hair);background-color:var(--sheet);padding:6px 10px;border-radius:3px;min-width:0;width:auto}
.tools .f.sel{padding-right:28px}
.search{position:relative;flex:1 1 220px;display:flex;min-width:0}
.search svg{position:absolute;left:10px;top:50%;width:15px;height:15px;transform:translateY(-50%);stroke:var(--mute);fill:none;stroke-width:1.8;pointer-events:none}
.search input{width:100%!important;padding-left:32px!important}
.sp{flex:1 1 0}

/* ---------- report: rows ---------- */
.dept,.min{margin-top:20px;scroll-margin-top:84px}
.dh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-bottom:6px;border-bottom:1.5px solid var(--ink)}
.dh .no{font:500 13px var(--f-mono);color:var(--brand)}
.dh h2{margin:0;font:700 17px var(--f-display)}
.dh .ct{font-size:13px;color:var(--mute)}
.dh .ct em{font-style:normal;color:var(--bad)}
.dh details{margin-left:auto;font-size:13px}
.dh summary{cursor:pointer;color:var(--mute)}
.dh details[open]{flex-basis:100%;margin-left:0}
.dh ul{margin:6px 0 4px;padding-left:20px;color:var(--mute);columns:2;column-gap:32px}
.rhead,.row{display:grid;grid-template-columns:28px minmax(0,2.7fr) minmax(0,1.45fr) minmax(0,1.25fr) 140px 84px 112px 34px;gap:0 8px;align-items:start}
.rhead{font-size:11.5px;color:var(--mute);padding:6px 0 4px 9px;letter-spacing:.03em}
.row{padding:7px 0 7px 6px;border-bottom:1px solid var(--hair);border-left:3px solid var(--idle);background:var(--sheet)}
.row.s-doing{border-left-color:var(--warn)}.row.s-delayed{border-left-color:var(--bad)}.row.s-done{border-left-color:var(--ok)}
.row.s-done .t{color:var(--mute)}
.c-no{font:400 12.5px var(--f-mono);color:var(--mute);padding-top:6px;text-align:right}
.t{font-weight:500}
.n{font-size:13.5px;color:var(--mute)}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:4px 6px 2px}
.late{display:block;font-size:12px;color:var(--bad);padding-left:7px;font-weight:500}
.c-prog{display:flex;flex-direction:column;gap:3px}
.c-prog .sel{font-family:var(--f-mono)}
.pb{height:3px;background:var(--idle-bg);margin:0 6px}
.pb i{display:block;height:100%;background:var(--ink)}
.kebab{width:30px;height:30px;border:1px solid transparent;background:none;border-radius:3px;display:grid;place-items:center;color:var(--mute)}
.kebab:hover,.kebab[aria-expanded="true"]{border-color:var(--hair);background:var(--soft);color:var(--ink)}
.kebab svg{width:16px;height:16px;fill:currentColor}
.addrow{border:0;background:none;color:var(--mute);padding:8px 9px;font-size:13.5px}
.addrow:hover{color:var(--brand)}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;padding-top:12px}
.mg label,.fl{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--mute)}
.mg .wide{grid-column:1/-1}
.two{display:grid;grid-template-columns:1fr 90px;gap:8px}

/* ---------- board ---------- */
.cols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--soft);border-top:2px solid var(--ink);padding:10px;min-height:180px}
.col.hot{outline:2px dashed var(--brand);outline-offset:-2px;background:var(--brand-bg)}
.col h3{margin:0 0 10px;font:700 14.5px var(--f-display);display:flex;justify-content:space-between;gap:8px}
.col h3 span{font:400 13px var(--f-mono);color:var(--mute)}
.card{background:var(--sheet);border:1px solid var(--hair);border-left:3px solid var(--idle);padding:9px 10px;margin-bottom:8px;cursor:grab;font-size:14px}
.card.s-doing{border-left-color:var(--warn)}.card.s-delayed{border-left-color:var(--bad)}.card.s-done{border-left-color:var(--ok)}
.card:hover{border-color:var(--ink)}
.card.dragging{opacity:.4}
.card b{display:block;font-weight:500;line-height:1.35}
.card small{display:block;color:var(--mute);font-size:12.5px;margin-top:4px}
.card .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11.5px;padding:0 7px;border-radius:99px;border:1px solid var(--hair);color:var(--mute)}
.tag.pr-high{border-color:var(--bad);color:var(--bad)}
.tag.urgent{background:var(--bad);border-color:var(--bad);color:#fff}
.card .pb{margin:8px 0 0}

/* ---------- calendar ---------- */
.calh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.calh .h{margin:0;min-width:170px}
.legend{margin-left:auto;display:flex;gap:14px;font-size:12.5px;color:var(--mute);flex-wrap:wrap}
.legend span{display:inline-flex;gap:6px;align-items:center}
.calw{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(100px,1fr));border-top:1.5px solid var(--ink);border-left:1px solid var(--hair);min-width:720px}
.cal-d{padding:6px 8px;font-size:12px;color:var(--mute);border-right:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.cal-c{min-height:116px;padding:5px;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);display:flex;flex-direction:column;gap:3px;min-width:0}
.cal-c.dim{background:var(--soft)}
.cal-c.dim .cal-n span{color:var(--mute)}
.cal-c.today{box-shadow:inset 0 0 0 2px var(--brand)}
.cal-n{display:flex;justify-content:space-between;align-items:center;font:500 13px var(--f-mono)}
.cal-c.today .cal-n span{background:var(--brand);color:var(--brand-ink);padding:0 6px;border-radius:2px}
.cal-add{opacity:0;border:1px solid var(--hair);background:var(--sheet);width:22px;height:22px;border-radius:3px;line-height:1;padding:0;color:var(--mute)}
.cal-c:hover .cal-add,.cal-add:focus{opacity:1}

/* ---------- minutes, setup ---------- */
.rec{border-top:1px solid var(--hair);padding:14px 0;display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:8px 20px;align-items:start}
.rec .mono{font-size:14px}
.rec p{margin:0 0 4px}
.rec small{color:var(--mute)}
.set{display:grid;grid-template-columns:1fr 1fr;gap:28px 36px}
.set h3{margin:0 0 10px;font:700 15.5px var(--f-display);padding-bottom:5px;border-bottom:1.5px solid var(--ink)}
.set label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--mute);margin-bottom:10px}
.set .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.dcard{border:1px solid var(--hair);padding:12px;margin-bottom:10px}
.dcard .r{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.dcard .r .box{flex:1 1 170px;width:auto}
.dcard .r select.box{flex:0 0 120px}
.ck{flex-direction:row!important;align-items:center;gap:6px!important;margin:0!important;font-size:13px!important}

/* ---------- dialog, menu, toast, agenda ---------- */
.dlg{position:fixed;inset:0;background:rgba(10,12,13,.5);display:grid;place-items:center;padding:16px;z-index:30}
.dlg[hidden]{display:none}
.dbox{background:var(--sheet);border:1.5px solid var(--ink);width:min(660px,100%);max-height:92%;overflow:auto;padding:20px;box-shadow:var(--shadow)}
.dbox h3{margin:0 0 4px;font:700 17px var(--f-display)}
.dbox .mg{padding-top:8px}
.dbox .out{width:100%;min-height:260px;font:400 13px/1.55 var(--f-body);white-space:pre-wrap}
.dsub{grid-column:1/-1;font:600 13px var(--f-display);color:var(--brand);border-top:1px solid var(--hair);padding-top:10px;margin-top:2px}
.hist{grid-column:1/-1;border-top:1px solid var(--hair);padding-top:10px}
.hist h4{margin:0 0 6px;font:600 13px var(--f-display);color:var(--mute)}
.hist ol{list-style:none;margin:0;padding:0;max-height:160px;overflow:auto}
.hist li{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:4px 0;border-bottom:1px dashed var(--hair)}
.hist time{color:var(--mute);font-size:12px;white-space:nowrap}
.dfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.menu{position:fixed;z-index:40;min-width:220px;max-width:300px;max-height:70vh;overflow:auto;background:var(--sheet);border:1px solid var(--ink);box-shadow:var(--shadow);padding:4px}
.menu[hidden]{display:none}

  else if(a==='ag-pause'){if(MEET.paused){MEET.end=Date.now()+MEET.left;MEET.paused=false;}else{MEET.left=MEET.end-Date.now();MEET.paused=true;}drawAgenda();}
  else if(a==='undo')doUndo();
  else if(a==='copy-out')copyText($('#out').value);
  else if(a==='logout'){sb.auth.signOut().then(function(){location.reload();});}
  else if(a==='retry')retrySync();
  else if(a==='add-member')addMember();
  else if(a==='del-member')memberOp(sb.from('mtg_members').delete().eq('user_id',v),'ถอนสิทธิ์แล้ว');
  else if(a==='add-dept'){mutate(function(){S.depts.push({id:uid(),name:'ฝ่ายใหม่',procure:false,minutes:10,topics:[]});});rerender();}
  else if(a==='del-dept'){var id=b.closest('[data-dept]').dataset.dept;mutate(function(){S.depts=S.depts.filter(function(d){return d.id!==id;});});rerender();toast('ลบฝ่ายแล้ว','undo','ย้อนกลับ');}
  else if(a==='exp-json')doJson();
});

  r.onload=function(){try{var d=JSON.parse(r.result);if(!Array.isArray(d.items)||!Array.isArray(d.depts)||!d.meta)throw 0;undo.push(JSON.stringify(S));S=norm(d);keep();rerender();toast('นำเข้าข้อมูลแล้ว','undo','ย้อนกลับ');}catch(x){toast('ไฟล์นี้ไม่ใช่ไฟล์สำรองของระบบนี้ เลือกไฟล์ .json ที่สำรองจากหน้านี้');}};r.readAsText(f);inp.value='';}

/* ---------- database ---------- */
var IMAP={dept:'dept_id',project:'project',title:'title',note:'note',owner:'owner',due:'due',status:'status',progress:'progress',stage:'stage',priority:'priority',needDate:'need_date',qty:'qty',unit:'unit',supplier:'supplier',po:'po',sort:'sort'};
function itemRow(i){var r={id:i.id};for(var k in IMAP){var v=i[k];if((k==='due'||k==='needDate')&&!v)v=null;if(k==='sort')v=+v||0;r[IMAP[k]]=v;}return r;}
function deptRow(d,x){return {id:d.id,name:d.name,procure:!!d.procure,minutes:+d.minutes||10,topics:d.topics||[],sort:x+1};}
function minRow(w,m){return {week:w,meet_date:m.date||null,attendees:m.attendees||'',decisions:m.decisions||'',followups:m.followups||''};}
function diffRow(a,b){var c=null;for(var k in b){if(k==='id'||k==='week')continue;if(JSON.stringify(a[k])!==JSON.stringify(b[k])){c=c||{};c[k]=b[k];}}return c;}
function byId(l){var m={};l.forEach(function(x,i){m[x.id]=[x,i];});return m;}
function chk(r){if(r&&r.error)throw r.error;return r;}
async function pushDiff(a,b,hq){
  if(JSON.stringify(a.meta)!==JSON.stringify(b.meta))chk(await sb.from('mtg_settings').upsert({id:1,data:b.meta}));
  var ad=byId(a.depts),bd=byId(b.depts),ai=byId(a.items),bi=byId(b.items),ps=[];
  b.depts.forEach(function(d,x){var r=deptRow(d,x),o=ad[d.id];if(!o)ps.push(sb.from('mtg_depts').insert(r));else{var c=diffRow(deptRow(o[0],o[1]),r);if(c)ps.push(sb.from('mtg_depts').update(c).eq('id',d.id));}});
  (await Promise.all(ps)).forEach(chk);ps=[];
  a.items.forEach(function(i){if(!bi[i.id])ps.push(sb.from('mtg_items').delete().eq('id',i.id));});
  b.items.forEach(function(i){var r=itemRow(i),o=ai[i.id];if(!o)ps.push(sb.from('mtg_items').insert(r));else{var c=diffRow(itemRow(o[0]),r);if(c)ps.push(sb.from('mtg_items').update(c).eq('id',i.id));}});
  (await Promise.all(ps)).forEach(chk);
  var hq2=hq.filter(function(h){return bi[h.item_id];});if(hq2.length)chk(await sb.from('mtg_item_history').insert(hq2));
  ps=[];a.depts.forEach(function(d){if(!bd[d.id])ps.push(sb.from('mtg_depts').delete().eq('id',d.id));});
  Object.keys(b.minutes).forEach(function(w){var r=minRow(w,b.minutes[w]),o=a.minutes[w];if(!o||diffRow(minRow(w,o),r))ps.push(sb.from('mtg_minutes').upsert(r));});
  (await Promise.all(ps)).forEach(chk);}
function queueSync(){var prev=SYNCED,next=clone(S),hq=HQ.splice(0);SYNCED=next;SY.n++;SY.err=null;syncBadge();
  SY.q=SY.q.then(function(){return pushDiff(prev,next,hq);}).then(function(){SY.n--;syncBadge();if(!SY.n&&pullPending)pullSoon();},
    function(e){SY.n--;SY.err=e;console.error(e);syncBadge();toast('บันทึกไม่สำเร็จ: '+(e.message||e)+' กด "ลองอีกครั้ง" ที่มุมขวาบน');});}
async function retrySync(){try{var fresh=await fetchAll();SYNCED=fresh;SY.err=null;queueSync();}catch(e){toast('ยังเชื่อมต่อไม่ได้: '+(e.message||e));}}
async function fetchAll(){
  var r=await Promise.all([sb.from('mtg_settings').select('data').eq('id',1).maybeSingle(),sb.from('mtg_depts').select('*').order('sort'),sb.from('mtg_items').select('*').order('sort'),sb.from('mtg_minutes').select('*'),
    sb.from('mtg_item_history').select('item_id,at,text,by_name').order('at',{ascending:false}).limit(2000),sb.from('projects').select('name,status').order('created_at'),sb.from('profiles').select('id,display_name,role'),sb.from('mtg_members').select('user_id,role,added_at')]);
  r.forEach(chk);
  var st={meta:(r[0].data&&r[0].data.data)||{},depts:r[1].data.map(function(d){return {id:d.id,name:d.name,procure:d.procure,minutes:d.minutes,topics:d.topics||[]};}),minutes:{},
    items:r[2].data.map(function(x){return {id:x.id,dept:x.dept_id,project:x.project,title:x.title,note:x.note,owner:x.owner,due:x.due||'',status:x.status,progress:x.progress,stage:x.stage,priority:x.priority,needDate:x.need_date||'',qty:x.qty,unit:x.unit,supplier:x.supplier,po:x.po,sort:x.sort};})};
  r[3].data.forEach(function(m){st.minutes[m.week]={date:m.meet_date||'',attendees:m.attendees,decisions:m.decisions,followups:m.followups};});
  var H={};r[4].data.forEach(function(h){(H[h.item_id]=H[h.item_id]||[]).push({t:h.at,x:h.text+(h.by_name?' · '+h.by_name:'')});});
  st.items.forEach(function(i){i.history=(H[i.id]||[]).slice(0,30);});
  PROJ_DB=(r[5].data||[]).filter(function(p){return p.status!=='closed';}).map(function(p){return p.name;});PROFILES=r[6].data||[];MEMBERS=r[7].data||[];
  return norm(st);}

var pullT=0,pullPending=false;
function editing(){var a=document.activeElement;return !!(a&&a.matches&&a.matches('#view input:not([data-flt]):not([type=checkbox]),#view textarea,#dbox input,#dbox textarea'));}
function pullSoon(){clearTimeout(pullT);pullT=setTimeout(pull,600);}
async function pull(){if(editing()||SY.n){pullPending=true;return;}pullPending=false;
  try{var fresh=await fetchAll();if(SY.n||editing()){pullPending=true;return;}S=fresh;SYNCED=clone(fresh);undo=[];rerender();}catch(e){console.error(e);}}

  return h;}

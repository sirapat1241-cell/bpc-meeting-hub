*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font:400 15px/1.5 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 20px;background:var(--sheet);border-bottom:1.5px solid var(--ink);position:sticky;top:0;z-index:10}
.logo{width:42px;height:42px;flex:none;background:#fff var(--logo) center/contain no-repeat;border:1px solid var(--hair)}
.logo.big{width:64px;height:64px;margin:0 auto 8px}
.who{display:flex;flex-direction:column;line-height:1.2}
.who b{font:700 15px var(--f-display);letter-spacing:.04em}.who span{font-size:12.5px;color:var(--mute)}
.wkbar{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap}
.sv{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.sync i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}
.sync.saving i{background:var(--warn)}.sync.err i{background:var(--bad)}.sync.err{color:var(--bad)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);background:var(--sheet);padding:6px 12px;border-radius:3px;font:600 13.5px var(--f-display);white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--soft)}.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}.btn.q{border-color:var(--hair);font-weight:500}
.ib{width:32px;height:32px;display:inline-grid;place-items:center;border:1px solid var(--hair);background:var(--sheet);border-radius:3px;font:500 16px var(--f-mono)}
.sel,.box{border:1px solid var(--hair);border-radius:3px;padding:6px 9px;background:var(--sheet);min-width:0}
.sel{appearance:none;-webkit-appearance:none;padding-right:28px;background:var(--sheet) var(--chev) no-repeat right 10px center;cursor:pointer}
.box:focus,.sel:focus{border-color:var(--brand);outline:0}
textarea.box{width:100%;min-height:90px;resize:vertical;line-height:1.55}
main{max-width:1320px;margin:0 auto;padding:18px 16px 80px}
.sheet{background:var(--sheet);border:1px solid var(--hair);padding:22px;margin-bottom:16px}
.lb{display:block;font-size:11.5px;color:var(--mute);letter-spacing:.04em;margin-bottom:2px}
.tb{display:grid;grid-template-columns:2.3fr 1.2fr 1fr 1.2fr;border:1.5px solid var(--ink)}
.tb>div{padding:10px 14px;border-left:1px solid var(--ink);min-width:0}.tb>div:first-child{border-left:0}
.tb h1{margin:0;font:700 21px/1.25 var(--f-display)}
.tb p{margin:2px 0 0;font-size:13px;color:var(--mute)}
.tb b.big{font:500 20px var(--f-mono)}
.agnav{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 0}
.agnav a{font-size:13px;text-decoration:none;color:var(--ink);border:1px solid var(--hair);padding:3px 10px;border-radius:99px;background:var(--sheet)}
.agnav a:hover{border-color:var(--brand);color:var(--brand)}
.dh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-bottom:6px;border-bottom:1.5px solid var(--ink);margin-bottom:14px}
.dh .no{font:600 13px var(--f-display);color:#fff;background:var(--brand);padding:1px 8px;border-radius:2px}
.dh h2{margin:0;font:700 18px var(--f-display)}.dh .ct{font-size:13px;color:var(--mute)}
.ag{scroll-margin-top:80px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{border:1px solid var(--hair);padding:12px 14px;min-width:0}
.kpi b{display:block;font:500 28px/1.15 var(--f-mono)}.kpi small{color:var(--mute);font-size:12.5px}
.kpi.bad b{color:var(--bad)}.kpi.ok b{color:var(--ok)}.kpi.br{border-top:3px solid var(--brand)}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;margin-top:16px;align-items:start}
.chart{border:1px solid var(--hair);padding:10px 12px}
.chart h3,.blk h3{margin:0 0 6px;font:700 14.5px var(--f-display)}
.leg{display:flex;gap:14px;font-size:12.5px;color:var(--mute);flex-wrap:wrap}
.leg i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px}
svg text{font-family:var(--f-body)}
.pb{position:relative;height:12px;background:var(--idle-bg);border-radius:2px;overflow:visible}
.pb .a{position:absolute;left:0;top:0;bottom:0;background:var(--ok);border-radius:2px}
.pb .a.late{background:var(--bad)}.pb .a.near{background:var(--warn)}
.pb .p{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}

  if(R.issues){L.push('');L.push('ปัญหา/อุปสรรค');L.push(R.issues);}
  if(R.decisions){L.push('');L.push('มติที่ประชุม');L.push(R.decisions);}
  L.push('');L.push(location.href.split('#')[0]);return L.join('\n');}
function lineDlg(){var t=lineText();$('#dbox').innerHTML='<h3>สรุปส่ง LINE</h3><textarea class="box" id="out" readonly></textarea><div class="dfoot"><button class="btn q" data-act="close">ปิด</button><a class="btn" style="border-color:#06c755;color:#06c755" target="_blank" rel="noopener" href="https://line.me/R/share?text='+encodeURIComponent(t.slice(0,4500))+'">ส่งเข้ากลุ่ม LINE</a><button class="btn pri" data-act="copy">คัดลอก</button></div>';$('#out').value=t;$('#dlg').hidden=false;}
function go(wk){if(WEEKS.indexOf(wk)<0)return;WK=wk;try{sessionStorage.setItem('mon-wk',WK);}catch(e){}render();}
document.addEventListener('change',function(e){var t=e.target;if(t.id==='wksel')return go(t.value);if(t.id==='only'){FLT.only=t.value;render();return;}
  if(t.dataset.pct){if(t.value!==''&&(isNaN(+t.value)||+t.value<0||+t.value>100)){toast('กรอกตัวเลข 0–100');render();return;}setPct(t.dataset.pct,t.value,null);return;}
  if(t.dataset.note){var r=rec(t.dataset.note,WK);setPct(t.dataset.note,r.pct,t.value);return;}
  if(t.dataset.rep)setRep(t.dataset.rep,t.dataset.rep==='meet_date'?(t.value||null):t.value);});
document.addEventListener('input',function(e){if(e.target.id==='q'){FLT.q=e.target.value;render();}});
document.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b){if(e.target.id==='dlg')$('#dlg').hidden=true;return;}var a=b.dataset.act;
  if(a==='wk')go(WEEKS[Math.max(0,Math.min(WEEKS.length-1,WEEKS.indexOf(WK)+(+b.dataset.v)))]);
  else if(a==='print')window.print();else if(a==='line')lineDlg();else if(a==='close')$('#dlg').hidden=true;
  else if(a==='copy'){var o=$('#out');o.select();try{navigator.clipboard.writeText(o.value).then(function(){toast('คัดลอกแล้ว');},function(){document.execCommand('copy');toast('คัดลอกแล้ว');});}catch(x){document.execCommand('copy');}}
  else if(a==='reload')load().then(render);else if(a==='logout')sb.auth.signOut().then(function(){location.reload();});});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){var d=$('#dlg');if(d)d.hidden=true;}if(e.key==='Enter'&&e.target.dataset&&(e.target.dataset.pct||e.target.dataset.note))e.target.blur();});

/* ---------- data + login ---------- */
async function load(){var r=await Promise.all([sb.from('mon_progress').select('week,task,pct,note'),sb.from('mon_reports').select('*'),sb.from('profiles').select('id,display_name').eq('id',ME.id).maybeSingle()]);
  r.forEach(function(x){if(x.error)throw x.error;});PROG={};r[0].data.forEach(function(p){(PROG[p.week]=PROG[p.week]||{})[p.task]={pct:+p.pct,note:p.note||''};});
  REP={};r[1].data.forEach(function(x){REP[x.week]=x;});if(r[2].data&&r[2].data.display_name)ME.name=r[2].data.display_name;SY.err=null;}
var pt=0;function editing(){var a=document.activeElement;return !!(a&&a.matches&&a.matches('input:not([type=search]):not(#wksel),textarea'));}
function remote(p){var n=p&&p.new;if(n&&n.updated_by===ME.id)return;clearTimeout(pt);pt=setTimeout(function again(){if(editing()||SY.n){pt=setTimeout(again,1500);return;}load().then(render).catch(console.error);},700);}
function gate(inner){$('#app').innerHTML='<div class="gate"><div class="gcard"><div class="logo big" role="img" aria-label="โลโก้บริษัท"></div><span class="gco">BOAT PATTANA CONSTRUCTION</span>'+inner+'</div></div>';}
function showLogin(msg){gate('<h1>รายงานความก้าวหน้า MONTE AVENUE</h1><form id="login" style="display:contents"><label>อีเมล<input class="box" type="email" id="em" autocomplete="username" required></label><label>รหัสผ่าน<input class="box" type="password" id="pw" autocomplete="current-password" required></label><p class="gerr" id="gerr">'+esc(msg||'')+'</p><button class="btn pri" type="submit" id="gobtn" style="justify-content:center">เข้าสู่ระบบ</button></form><p class="gnote">ใช้อีเมลและรหัสผ่านเดียวกับระบบหลักของบริษัท</p>');}
document.addEventListener('submit',async function(e){if(e.target.id!=='login')return;e.preventDefault();var b=$('#gobtn');b.disabled=true;b.textContent='กำลังเข้าสู่ระบบ…';
  var r=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(r.error){b.disabled=false;b.textContent='เข้าสู่ระบบ';$('#gerr').textContent='เข้าสู่ระบบไม่สำเร็จ: อีเมลหรือรหัสผ่านไม่ถูกต้อง';return;}enter(r.data.session);});
async function enter(s){ME={id:s.user.id,email:s.user.email,name:s.user.email};gate('<p class="gnote">กำลังโหลดข้อมูล…</p>');
  var r=await sb.rpc('mtg_role');if(r.error){showLogin('เชื่อมต่อฐานข้อมูลไม่สำเร็จ: '+r.error.message);return;}ROLE=r.data;
  if(!ROLE){gate('<h1>ยังไม่มีสิทธิ์</h1><p class="gnote">บัญชี '+esc(ME.email)+' ยังไม่ได้รับสิทธิ์ในระบบประชุม ให้ PM เพิ่มสิทธิ์ที่ ศูนย์ข้อมูลการประชุม &gt; ตั้งค่า &gt; สิทธิ์เข้าใช้ระบบประชุม</p><button class="btn" data-act="logout">ออกจากระบบ</button>');return;}
  try{await load();}catch(e){showLogin('โหลดข้อมูลไม่สำเร็จ: '+(e.message||e));return;}
  var ch=sb.channel('mon');['mon_progress','mon_reports'].forEach(function(t){ch.on('postgres_changes',{event:'*',schema:'public',table:t},remote);});ch.subscribe();render();
  if(location.hash){var t=$(location.hash);if(t)t.scrollIntoView();}}
async function boot(){if(!window.supabase){gate('<h1>โหลดระบบไม่สำเร็จ</h1><p class="gnote">ตรวจการเชื่อมต่ออินเทอร์เน็ต แล้วรีเฟรชหน้านี้</p>');return;}
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});var s=await sb.auth.getSession();if(s.data&&s.data.session)enter(s.data.session);else showLogin();}
boot();
})();
